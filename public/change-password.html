<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOIF Cloud — Cambio Obligatorio de Contraseña</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="brand-row">
      <div class="brand-mark">JC</div>
      <div>
        <div class="brand-title">JOIF Cloud</div>
        <div class="brand-sub">Cambio obligatorio de clave inicial</div>
      </div>
    </div>

    <p style="font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.5;">
      Por seguridad, define una contraseña propia de al menos <strong style="color:var(--text)">12 caracteres</strong>.
    </p>

    <div id="errorMsg" class="alert alert-error"></div>

    <form id="changeForm">
      <div class="field">
        <label for="newpass">Nueva contraseña (mín. 12 caracteres)</label>
        <input type="password" id="newpass" class="input" placeholder="Mínimo 12 caracteres" required minlength="12" maxlength="256">
      </div>
      <div class="field">
        <label for="confirmpass">Confirmar contraseña</label>
        <input type="password" id="confirmpass" class="input" placeholder="Repite la nueva contraseña" required minlength="12" maxlength="256">
      </div>
      <button type="submit" id="saveBtn" class="btn btn-primary btn-full">Guardar y Continuar</button>
    </form>
  </div>

  <script>
    const token = localStorage.getItem('mivpn_token');
    if (!token) window.location.href = 'login.html';

    document.getElementById('changeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = document.getElementById('newpass').value;
      const p2 = document.getElementById('confirmpass').value;
      const errEl = document.getElementById('errorMsg');
      const btn = document.getElementById('saveBtn');

      errEl.style.display = 'none';
      if (p1.length < 12) {
        errEl.textContent = 'La contraseña debe tener al menos 12 caracteres.';
        errEl.style.display = 'block';
        return;
      }
      if (p1 !== p2) {
        errEl.textContent = 'Las contraseñas no coinciden.';
        errEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Guardando...';
      try {
        const res = await fetch('/api/auth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ newPassword: p1 })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          window.location.href = 'index.html';
        } else {
          errEl.textContent = data.error || 'No se pudo actualizar la contraseña.';
          errEl.style.display = 'block';
        }
      } catch (_) {
        errEl.textContent = 'Error de conexión con el servidor.';
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Guardar y Continuar';
      }
    });
  </script>
</body>
</html>
