<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiVPN Cloud - Cambiar Contraseña</title>
  <style>
    body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-container { background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 100%; max-width: 350px; text-align: center; }
    .login-container h1 { color: #38bdf8; margin-bottom: 24px; font-size: 22px; }
    input { width: 100%; padding: 12px; margin-bottom: 16px; border: 1px solid #334155; border-radius: 6px; background: #0f172a; color: white; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
    button:hover { background: #059669; }
    .error { color: #f43f5e; margin-bottom: 16px; display: none; }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Cambio Obligatorio</h1>
    <p style="color: #94a3b8; margin-bottom: 24px; font-size: 14px;">Por seguridad, debes cambiar tu contraseña temporal.</p>
    <div id="errorMsg" class="error">Las contraseñas no coinciden</div>
    <form id="changeForm">
      <input type="password" id="newpass" placeholder="Nueva Contraseña" required minlength="5">
      <input type="password" id="confirmpass" placeholder="Confirmar Contraseña" required minlength="5">
      <button type="submit">Guardar y Entrar</button>
    </form>
  </div>

  <script>
    document.getElementById('changeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = document.getElementById('newpass').value;
      const p2 = document.getElementById('confirmpass').value;
      
      if (p1 !== p2) {
        document.getElementById('errorMsg').style.display = 'block';
        return;
      }
      
      const token = localStorage.getItem('mivpn_token');
      
      try {
        const res = await fetch('/api/auth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ newPassword: p1 })
        });
        
        if (res.ok) {
          window.location.href = '/index.html';
        } else {
          alert('Error cambiando contraseña');
        }
      } catch (err) {
        alert('Error conectando al servidor');
      }
    });
  </script>
</body>
</html>
