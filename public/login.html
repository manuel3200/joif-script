<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOIF Cloud — Iniciar Sesión</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="brand-row">
      <div class="brand-mark">JC</div>
      <div>
        <div class="brand-title">JOIF Cloud</div>
        <div class="brand-sub">Panel de Administración de Nodo</div>
      </div>
    </div>

    <div id="errorMsg" class="alert alert-error"></div>

    <form id="loginForm">
      <div class="field">
        <label for="username">Usuario administrador</label>
        <input type="text" id="username" class="input" placeholder="admin" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" class="input" placeholder="••••••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" id="submitBtn" class="btn btn-primary btn-full">Ingresar al Panel</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('errorMsg');
      const btn = document.getElementById('submitBtn');

      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Verificando...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.token) {
          localStorage.setItem('mivpn_token', data.token);
          window.location.href = data.needsChange ? 'change-password.html' : 'index.html';
        } else {
          errEl.textContent = data.error || 'Credenciales incorrectas.';
          errEl.style.display = 'block';
        }
      } catch (_) {
        errEl.textContent = 'No se pudo conectar con el nodo.';
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Ingresar al Panel';
      }
    });
  </script>
</body>
</html>
